name: "Security scan (Semgrep + Bandit + pip-audit)"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  run-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Run semgrep (auto rules)
        run: |
          semgrep --config auto --output semgrep_result.json --json .
      - name: Upload semgrep result
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-result
          path: semgrep_result.json

      - name: Install Bandit and pip-audit
        run: |
          pip install bandit pip-audit

      - name: Run Bandit
        run: |
          bandit -r . -f json -o bandit_result.json || true
      - name: Upload bandit result
        uses: actions/upload-artifact@v4
        with:
          name: bandit-result
          path: bandit_result.json

      - name: Run pip-audit
        run: |
          pip-audit --format json > pip_audit_result.json || true
      - name: Upload pip-audit result
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-result
          path: pip_audit_result.json
